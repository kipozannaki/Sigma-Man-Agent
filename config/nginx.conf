# Nginx 反向代理：SSE 必须关闭缓冲
server {
    listen 80;

    location / {
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 关键配置：禁用缓冲，超时放宽到 10 分钟
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
